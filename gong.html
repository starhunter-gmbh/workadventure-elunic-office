<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gong</title>
<script src="https://workadventure.starhunter.software/iframe_api.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #1b2232; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  form { width: min(420px, 90vw); display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  textarea { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid #556; background: #0f1420; color: #fff; resize: vertical; min-height: 80px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 0; cursor: pointer; }
  .primary { background: #c4962e; color: #1b1b1b; font-weight: 600; }
  .secondary { background: #3a4458; color: #fff; }
  small { color: #9aa3b5; }
</style>
</head>
<body>
<form id="f">
  <h1 id="title">Hit the gong</h1>
  <textarea id="msg" maxlength="200" placeholder="Message to everyone in the office" required autofocus></textarea>
  <small id="hint">Everyone in the office hears the gong and sees your message.</small>
  <div class="row">
    <button type="button" class="secondary" id="cancel">Cancel</button>
    <button type="submit" class="primary" id="send">Gong!</button>
  </div>
</form>
<script>
// Browser language: German for "de*", English otherwise (labels and the sender's own banner).
if ((navigator.language || "").toLowerCase().startsWith("de")) {
  document.documentElement.lang = "de";
  document.getElementById("title").textContent = "Gong schlagen";
  document.getElementById("msg").placeholder = "Nachricht an alle im Büro";
  document.getElementById("hint").textContent = "Alle im Büro hören den Gong und sehen deine Nachricht.";
  document.getElementById("cancel").textContent = "Abbrechen";
}
WA.onInit().then(() => {
  const close = () => WA.ui.modal.closeModal();
  document.getElementById("cancel").onclick = close;
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const message = document.getElementById("msg").value.trim().slice(0, 200);
    if (!message) return;
    const from = WA.player.name || "Someone";
    await WA.event.broadcast("elunic-gong", { from, message });
    // ring locally for the sender
    try { WA.sound.loadSound(new URL("elunic-gong.ogg", location.href).toString()).play({ volume: 0.7, loop: false }); } catch (err) { console.warn(err); }
    WA.ui.banner.openBanner({ id: "elunic-gong", text: ((navigator.language || "").toLowerCase().startsWith("de") ? from + " hat den Gong geschlagen: " : from + " hit the gong: ") + message, bgColor: "#7a5a12", textColor: "#ffffff", closable: true, timeToClose: 30000 });
    close();
  };
});
</script>
</body>
</html>
